<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
<title id="title">Triton Ocean Systems — Make the ocean observable</title>
<desc id="desc">Ocean data and distributed observation infrastructure. Conceptual stages: observe, qualify and access. Not a depiction of deployed coverage.</desc>
<rect width="1440" height="420" rx="16" fill="#03111a"/>
<path d="M0 0V420" stroke="#00becd" stroke-width="12"/>
<text x="72" y="75" fill="#00becd" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="3">OCEAN DATA · OBSERVATION INFRASTRUCTURE</text>
<text x="72" y="154" fill="#f6f9fa" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="700">TRITON OCEAN SYSTEMS</text>
<text x="72" y="213" fill="#f6f9fa" font-family="Arial,Helvetica,sans-serif" font-size="31">Make the ocean observable.</text>
<text x="72" y="277" fill="#93aeb8" font-family="Arial,Helvetica,sans-serif" font-size="21">Persistent observations. Queryable ocean data.</text>
