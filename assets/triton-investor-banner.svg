<text x="915" y="191" fill="#93aeb8" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2">QUALIFY</text>
<text x="915" y="288" fill="#93aeb8" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2">ACCESS</text>
<text x="72" y="370" fill="#93aeb8" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2">PRE-SEED INVESTOR PRESENTATION</text>
